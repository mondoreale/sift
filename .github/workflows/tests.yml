name: Tests

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CI: 'true'
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit and integration tests
              run: pnpm run test

            - name: Check types
              run: pnpm run typecheck

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run browser tests against development server
              run: pnpm run test:browser --output=test-results/development

            - name: Build production application
              run: pnpm run build

            - name: Run browser tests against production server
              run: pnpm run test:browser --output=test-results/production
              env:
                  TEST_BUILT: '1'

            - name: Upload test failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 7
